<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm khách thuê mới</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f7f6; }
        .sidebar { width: 250px; position: fixed; height: 100%; background: #333; padding-top: 20px; }
        .sidebar a { padding: 15px; text-decoration: none; font-size: 18px; color: #fff; display: block; }
        .sidebar a:hover { background: #555; }
        .content { margin-left: 260px; padding: 20px; }

        .form-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-top: 20px; max-width: 500px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-submit { background-color: #16a085; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn-submit:hover { background-color: #1abc9c; }
        .btn-cancel { background-color: #95a5a6; color: white; padding: 12px 20px; border: none; border-radius: 4px; text-decoration: none; font-size: 16px; font-weight: bold; margin-left: 10px; }
    </style>
</head>
<body>

<!-- Giữ nguyên Menu bên trái -->
<div class="sidebar">
    <h2 style="color: white; text-align: center; font-size: 20px;">MENU</h2>
    <a href="index.html" style="background: #555;">📊 Tổng quan</a>
    <a href="list.html">🚪 Quản lý phòng</a>
    <a href="list.html">👥 Quản lý khách thuê</a>
    <a href="list.html">📜 Quản lý hợp đồng</a>
    <a href="index.html">📈 Thống kê chi thu</a>
    <a href="login.html" style="margin-top: 50px; color: #ff7675;">➡️ Đăng xuất</a>
</div>

<!-- Nội dung chính -->
<div class="content">
    <h1>THÊM KHÁCH THUÊ MỚI 👥</h1>
    <hr>

    <div class="form-container">
        <!-- Thẻ Form kết nối với đối tượng tenant ở Controller -->
        <form th:action="@{/tenant/add}" th:object="${tenant}" method="POST">

            <div class="form-group">
                <label for="fullName">Họ và tên khách thuê:</label>
                <input type="text" th:field="*{fullName}" placeholder="Ví dụ: Nguyễn Văn A" required>
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại:</label>
                <input type="text" th:field="*{phone}" placeholder="Ví dụ: 0987654321" required>
            </div>

            <div class="form-group">
                <label for="idCard">Số CCCD:</label>
                <input type="text" th:field="*{idCard}" placeholder="Nhập 12 số CCCD" required>
            </div>

            <div class="form-group">
                <label for="roomNumber">Xếp vào phòng (Số phòng):</label>
                <input type="text" th:field="*{roomNumber}" placeholder="Ví dụ: P101 (Để trống nếu chưa xếp)">
            </div>

            <div style="margin-top: 30px;">
                <button type="submit" class="btn-submit">Lưu thông tin</button>
                <a href="/tenant/list" class="btn-cancel">Hủy bỏ</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
