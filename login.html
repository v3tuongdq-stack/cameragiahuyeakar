<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Hệ thống Quản lý Camera - Phong cách TGDĐ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="login-box">
        <h2>Đăng nhập quản trị</h2>
        <form action="index.html" method="get">
            <input 
                type="text" 
                name="username" 
                placeholder="Tên đăng nhập" 
                required>

            <input 
                type="password" 
                name="password" 
                placeholder="Mật khẩu" 
                required>

            <button type="submit">
                ĐĂNG NHẬP HỆ THỐNG
            </button>
        </form>
    </div>

</body>
</html>
