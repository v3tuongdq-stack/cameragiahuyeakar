<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Quản lý Cửa hàng Camera</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-box">
        <h2 style="text-align: center; color: #2d3436;">CỬA HÀNG CAMERA & THIẾT BỊ CÔNG NGHỆ</h2>
        <form action="index.html" method="get">
            <input type="text" name="username" placeholder="Tên đăng nhập quản trị" required style="width: 100%; padding: 10px; margin: 10px 0;">
            <input type="password" name="password" placeholder="Mật khẩu" required style="width: 100%; padding: 10px; margin: 10px 0;">
            <button type="submit" style="width: 100%; padding: 12px; background: #fff200; border: none; font-weight: bold; cursor: pointer;">ĐĂNG NHẬP HỆ THỐNG</button>
        </form>
    </div>

</body>
</html>
